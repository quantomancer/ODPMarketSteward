apiVersion: odp-market-steward.qmvp/v1
kind: RequirementsNormalization

metadata:
  id: odp-market-steward-bundle-requirements
  version: "1.2.0"
  status: incorporated
  classification: project_requirements_mapping
  sourceDocument: FuncitionalRequirements.html
  sourceDraft: "0.4"
  priorSourceDraft: "0.2"
  technicalDocument: TechnicalRequirements.html
  technicalDraft: "0.2"
  sourceRequirementStatus: tracked_item_by_item_in_project_plan

purpose: >-
  Record how the responsibility issues found in Draft 0.2 were incorporated into
  Functional Requirements Draft 0.3, retain that migration history, and map current
  Functional Requirements Draft 0.4 and Technical Requirements Draft 0.2 to the
  responsibility-correct governed bundle. This file is a migration and traceability
  record; it does not override current requirements or the evidence status controlled
  by ProjectPlan.html.

authority:
  sourceDocumentStatus: normative_project_requirements_draft
  technicalDocumentStatus: normative_project_requirements_draft
  normalizationStatus: migration_and_traceability_record
  precedence: >-
    Functional Requirements Draft 0.4 and Technical Requirements Draft 0.2 contain
    the current requirements. The normalizations below describe the completed wording
    migration from Draft 0.2 through Draft 0.3 and must not be used as a hidden runtime
    or implementation-status override.

normalizations:
  - id: NR-001
    affectedRequirements: [FR-ODP-001, FR-ODP-002]
    priorIssue: >-
      Draft 0.2 treated ODPS as the configuration source for instruments, API
      routes, formulas, session policy, and publication policy.
    incorporatedInterpretation: >-
      Draft 0.3 makes the versioned governed bundle the resolution source. ODPS
      owns product declarations and commitments; artifact-specific contracts own
      the interface, value set, calculations, monitoring, publication, application,
      and technical delivery behavior.
    incorporatedInDraft: "0.3"
    sourceRevisionRequired: false

  - id: NR-002
    affectedRequirements: [FR-BAR-002]
    priorIssue: Draft 0.2 said formulas were declared in an ODPS extension.
    incorporatedInterpretation: >-
      Draft 0.3 resolves formula identifiers and definitions from
      rules/ohlc-rules.yaml while ODPS retains compact product-level quality
      declarations and references.
    incorporatedInDraft: "0.3"
    sourceRevisionRequired: false

  - id: NR-003
    affectedRequirements: [FR-PUB-001, FR-ACK-001, FR-ACK-002]
    priorIssue: Draft 0.2 placed acknowledgement behavior in an ODPS extension.
    incorporatedInterpretation: >-
      ODPS contains the exact product-level disclaimer statement. Publication
      policy owns required surfaces and presentation; the MCP application contract
      and technical requirements own the signed session acknowledgement mechanism.
    incorporatedInDraft: "0.3"
    sourceRevisionRequired: false

  - id: NR-004
    affectedRequirements: [FR-ODP-003]
    priorIssue: Draft 0.2 implied that all product-discovery facts came from ODPS.
    incorporatedInterpretation: >-
      Draft 0.3 requires each answer to cite the responsibility-owning artifact,
      stable pointer, version, and digest. ODPS pointers are used only for facts
      owned by the product contract.
    incorporatedInDraft: "0.3"
    sourceRevisionRequired: false

  - id: NR-005
    affectedRequirements: [FR-ODP-001, FR-ODP-002]
    priorIssue: >-
      Draft 0.2 linked to a nonexistent requirements/fxlive.odps.yaml path and named
      product version 1.0.0.
    incorporatedInterpretation: >-
      Draft 0.3 links to ../product/fxlive.odps.yaml and names product
      fxlive-market-data-demo-fx35 version 1.1.0.
    incorporatedInDraft: "0.3"
    sourceRevisionRequired: false

