resolvedDecisions:
  - decisionID: OD-001
    resolution: live completed-bar service with governance as augmented value
  - decisionID: OD-001A
    resolution: ODP Market Steward name and competition title locked
  - decisionID: OD-006
    resolution: manual refresh for MVP with completed BarEnd comparison
  - decisionID: OD-007
    resolution: separate Cloudflare MCP Worker, Durable Object session state, versioned component, and rights-gated R2
  - decisionID: OD-008
    resolution: >-
      Arbitrary-precision decimal at 34 significant digits; ROUND_HALF_EVEN;
      canonical machine strings without presentation rounding; JPY- and HUF-quoted
      prices and deltas at 3 decimals and other governed instruments at 5;
      percentage and basis points at 2; ratios at 4; trailing zeros retained except
      every rounded signed zero displays as 0; presentation-boundary rounding only.

