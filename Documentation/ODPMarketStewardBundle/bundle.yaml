runtimePolicy:
  resolutionMode: two_phase_parse_then_link
  loadOrder:
    - bundle.yaml
    - product/fxlive.odps.yaml
    - interface/fxlive.openapi.yaml
    - value-sets/fx35-instrument-set.yaml
    - rules/ohlc-rules.yaml
    - operations/monitoring.yaml
    - policies/publication-policy.yaml
    - application/mcp-application.yaml
  conflictPolicy:
    productFacts: product/fxlive.odps.yaml
    httpInterface: interface/fxlive.openapi.yaml
    instrumentMembership: value-sets/fx35-instrument-set.yaml
    calculationsAndRules: rules/ohlc-rules.yaml
    runtimeStateAndFreshness: operations/monitoring.yaml
    publicPresentation: policies/publication-policy.yaml
    mcpToolsAndModelBoundary: application/mcp-application.yaml
    functionalRequirements: requirements/FuncitionalRequirements.html
    technicalArchitectureAndOperations: requirements/TechnicalRequirements.html
    requirementsMigrationAndTraceability: requirements/bundle-requirements.yaml
    implementationDetailedDesign: design/DetailedLevelDesign.html
    precedenceRule: >-
      A specialized companion artifact controls its assigned responsibility. ODPS
      remains authoritative for product declarations and commitments and must not be
      treated as the implementation source for other responsibilities. Functional and
      technical requirements govern acceptance and delivery but do not override
      versioned product or companion facts. The detailed-level design is non-normative,
      may expose implementation blockers, and cannot override any controlling artifact
      or requirement.
  integrityFailurePolicy:
    marketValuesMayRemainViewable: true
    governedFitnessVerdictPermitted: false
    requiredDisclosure: identify failing artifact, expected digest, observed digest, and validation layer
  fixedMarketDataOrigin: https://fxlive.qmvp.workers.dev
  permittedMarketDataOperations: [getHealth, getSnapshotMetadata, getLatestObservation]

validationModel:
  layers:
    - id: syntax
      description: YAML or HTML parses according to the relevant file format.
    - id: controlling-schema
      description: ODPS is evaluated against its declared official schema; OpenAPI against OAS 3.1 semantics.
    - id: semantic-policy
      description: Artifact responsibility, public wording, UTC, state, and financial-safety rules are checked.
    - id: cross-reference
      description: >-
        Every normative relative path, pointer, dependency, enum, and digest agrees
        across the package; the normalization artifact records the completed Draft
        0.2 to Draft 0.3 migration without acting as a hidden override.
    - id: source-alignment
      description: API operations and response shapes are compared with the authoritative Worker source and focused live samples.
    - id: sdk-compatibility
      description: Pinned ODP SDK compatibility is reported separately and is not equivalent to controlling-schema validity.
  certificationClaim: none
  odpiCertificationClaimPermitted: false
  projectArtifactStructuralContracts:
    value-sets/fx35-instrument-set.yaml:
      apiVersion: odp-market-steward.qmvp/v1
      kind: ControlledValueSet
      requiredSections: [metadata, semanticAlignment, spec, references]
    rules/ohlc-rules.yaml:
      apiVersion: odp-market-steward.qmvp/v1
      kind: DeterministicRuleSet
      requiredSections: [metadata, governance, dependencies, spec, presentationConstraints, requirementIDs]
    operations/monitoring.yaml:
      apiVersion: odp-market-steward.qmvp/v1
      kind: OperationalMonitoringProfile
      requiredSections: [metadata, dependencies, spec, observability, requirementIDs]
    policies/publication-policy.yaml:
      apiVersion: odp-market-steward.qmvp/v1
      kind: PublicationPolicy
      requiredSections: [metadata, identity, disclaimer, temporalPresentation, evidencePresentation, contentBoundaries, componentRequirements, releaseGates, requirements]
    application/mcp-application.yaml:
      apiVersion: odp-market-steward.qmvp/v1
      kind: MCPApplicationContract
      requiredSections: [metadata, distribution, productExperience, componentResources, serverInitialization, sessionControls, bundleConsumption, responsibilityBoundary, apiAdapter, tools, mcpDescriptorMaterialization, toolErrorContract, evidenceModeContract, marketResultStateContract, stewardBriefContract, mcpResultEnvelope, schemas, securityAndPrivacy, requirements]
    requirements/bundle-requirements.yaml:
      apiVersion: odp-market-steward.qmvp/v1
      kind: RequirementsNormalization
      requiredSections: [metadata, purpose, authority, normalizations, artifactResponsibility, coverage, technicalRequirementsCoverage, resolvedDecisions, unresolvedRequirements, competitionConstraintCoverage, odpFamilyScope]
  htmlStructuralContracts:
    requiredLanguage: en
    requiredMeta: [charset, viewport]
    requiredNonEmptyElements: [title, h1]
  projectArtifactSemanticValidation:
    algorithmVersion: "1.0.0"
    executionOrder:
      - parse all YAML with duplicate-key rejection
      - enforce each declared apiVersion, kind, and required section
      - resolve normative bundle-relative paths and JSON Pointers without leaving the bundle root
      - enforce artifact-specific invariants below
      - verify manifest versions, dependencies, and SHA-256 digests
      - >-
        emit one typed result for every artifact and applicable validation-layer pair,
        represent inapplicable or unexecuted layers explicitly, and fail closed for
        governed fitness when a required layer fails or is missing
    runtimeEvidenceContract:
      layerVocabulary: [syntax, controlling-schema, semantic-policy, cross-reference, source-alignment, sdk-compatibility]
      resultIdentity: unique_artifactId_plus_layer
      inapplicableLayerStatus: NOT_APPLICABLE
      unexecutedLayerStatus: NOT_TESTED
      everyRuntimeArtifactMustHaveSyntaxSemanticPolicyAndCrossReferenceResults: true
    artifactChecks:
      instrument-set:
        - member count equals 35
        - symbols are unique and alphabetically ordered
        - every symbol equals base plus quote and both codes are declared
        - symbol projection equals the MCP Instrument enum exactly
      ohlc-rules:
        - every referenced rule identifier exists
        - formulas, required inputs, zero-denominator behavior, and state vocabularies are explicit
        - snapshot failure maps rule state FAIL separately from availability INCOHERENT
        - closed-market, recorded, synthetic, and missing-evidence fitness outcomes are deterministic
      monitoring:
        - canonical timezone and public timestamps are UTC with Z suffix
        - service, availability, evidence, freshness, and cache-age semantics are non-overlapping
        - unavailable calendar and unconfirmed CreatedAt semantics use safe non-PASS defaults
        - network operations are restricted to the fixed origin and declared OpenAPI operations
      publication-policy:
        - exact disclaimer text and required public surfaces match the product contract
        - explicit verifiable component-mediated acknowledgement is mandatory before market-data retrieval, while the mechanism is delegated to the app and technical contracts
        - public identity, accessibility, financial-safety, and data-rights release gates are present
      mcp-application-contract:
        - tool names and titles are unique and every consumes ID exists in this manifest
        - twelve advertised schemas materialize as standalone JSON Schemas with no unresolved references
        - five model-visible domain tools are read-only and one component-only acknowledgement tool owns the bounded session-state mutation
        - every tool advertises public no-auth security metadata and truthful read, mutation, and idempotency annotations
        - every market-data output has disclosure-required and success branches with the exact disclaimer
        - success branches expose typed evidence, cache age, calendar time, plausibility, and validation layers
        - product-profile sections have all responsibility-owning artifacts in consumes
        - public result evidence modes are LIVE, RECORDED, or NONE and request modes are independently typed
        - no-evidence, manual component-identified refresh, and Steward Brief failure paths are explicit
        - every gated market-data tool links the disclosure component and uses the signed Durable Object session challenge contract
        - the pinned Cloudflare Agents SDK Agent plus persistent WorkerTransport contract owns opaque session identifiers and deterministic Durable Object mapping
        - recorded evidence requires artifact, bundle, product, policy, content, retention, validation, and create-only integrity metadata
        - the Cloudflare MCP Worker uses only the public source API and never receives the source KV binding
        - optional Steward Brief generation is a bounded server-side gpt-5.6 Responses API call
      requirements-normalization:
        - every source FR and NFR identifier appears exactly in normalized coverage
        - every source TR identifier appears exactly in technical requirements coverage
        - every competition constraint and review decision is represented as resolved or unresolved
        - ODPI-family responsibilities are not assigned to project companion artifacts
        - all five Draft 0.2 normalization issues are marked incorporated in Draft 0.3 with no pending source revision

