apiVersion: odp-market-steward.qmvp/v1
kind: GovernedProductBundle

metadata:
  id: odp-market-steward-fxlive-bundle
  name: "ODP Market Steward — FXLive governed product bundle"
  version: "1.6.0"
  status: draft
  classification: project_bundle_manifest
  constructName: ODPS-centred-market-data-product-package
  description: >-
    Versioned specification package for the FXLive Market Data Demo and its planned
    ODP Market Steward ChatGPT MCP App and Cloudflare service. This manifest is
    project-defined and is not an ODPI specification, ODPG graph, ODPC catalog,
    ODPV vocabulary, or ODPR recipe.

product:
  id: fxlive-market-data-demo-fx35
  version: "1.1.3"
  lifecycleStatus: testing
  contract: product/fxlive.odps.yaml

standards:
  - name: Open Data Product Specification
    abbreviation: ODPS
    version: "4.1"
    role: product contract
    artifact: product/fxlive.odps.yaml
    schema: https://opendataproducts.org/v4.1/schema/odps.yaml
  - name: OpenAPI Specification
    abbreviation: OAS
    version: "3.1.2"
    role: HTTP API interface contract
    artifact: interface/fxlive.openapi.yaml
    specification: https://spec.openapis.org/oas/v3.1.2.html

odpFamilyCoverage:
  ODPS:
    status: included
    version: "4.1"
    path: product/fxlive.odps.yaml
  ODPC:
    status: not_in_scope
    reason: One product package does not currently implement a product catalog or portfolio.
  ODPG:
    status: not_present
    reason: No relationship graph exists; manifest dependencies are not graph claims.
  ODPV:
    status: not_present
    reason: >-
      The product-defined FX-35 membership list is a project domain value set, not
      the shared Open Data Products family vocabulary.
  ODPR:
    status: not_present
    reason: >-
      Runtime calculation rules are project rule contracts. Draft ODPR is not used
      as an execution engine or implementation claim.

