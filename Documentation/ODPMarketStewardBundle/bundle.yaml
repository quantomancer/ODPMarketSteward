knownImplementationGaps:
  - id: GAP-001
    severity: release_blocker
    topic: public HTML disclosure
    detail: >-
      The current Worker-generated root HTML page does not display the required
      MARKET DATA DEMO label and full disclaimer.
  - id: GAP-002
    severity: release_blocker
    topic: data rights and attribution
    detail: >-
      Public display, redistribution, recording, judge access, and attribution
      treatment require written confirmation. The disclaimer is not authorization.
  - id: GAP-003
    severity: governed_state_blocker
    topic: market calendar
    detail: No authoritative UTC market-calendar adapter is selected or contract-tested.
  - id: GAP-004
    severity: governed_freshness_blocker
    topic: CreatedAt semantics
    detail: Producer-level confirmation of CreatedAt semantics remains pending.
  - id: GAP-007
    severity: governance_gap
    topic: product license and data holder
    detail: >-
      ODPS does not contain owner-approved license or data-holder facts. They are
      optional for schema validity but important before professional public release.
  - id: GAP-008
    severity: implementation_gap
    topic: MCP application
    detail: >-
      The separate Cloudflare MCP Worker, Durable Object session state, secrets,
      sanitized observability, Apps SDK component, GPT-5.6 call, and public /mcp
      endpoint are not implemented, provisioned, or deployed. The Agents SDK version,
      Durable Object migration, public app domain, and exact CSP remain release blockers.
  - id: GAP-009
    severity: interface_risk
    topic: stored data forwarding
    detail: >-
      The Worker forwards stored labels, timestamps, epoch, and prices without
      governed validation and selects the last stored bar-array entry.
  - id: GAP-010
    severity: implementation_constraint
    topic: cache control
    detail: >-
      The API publishes Cache-Control no-store; persistent or cross-tool response
      caching is prohibited and LAST_AVAILABLE is therefore unavailable in v1.
  - id: GAP-011
    severity: interface_risk
    topic: unhandled platform exceptions
    detail: >-
      The Worker does not wrap every storage or JSON exception in a stable documented
      error envelope; an uncaught failure may produce a platform-generated 500 response.
  - id: GAP-012
    severity: implementation_gap
    topic: OpenAPI publication
    detail: The contract is packaged locally but is not served from a public API documentation URL.

releaseStatus:
  bundleArtifactSetCompleteForCurrentDraft: true
  specificationDecisionComplete: false
  runtimeImplementationComplete: false
  publicationReady: false
  competitionSubmissionReady: false
  reason: unresolved release blockers and unimplemented MCP application
