openapi: 3.1.2

info:
  title: FXLive Market Data Demo API
  version: 1.0.0
  summary: Read-only access to the latest stored one-minute FX market-data snapshot.
  description: >-
    MARKET DATA DEMO. For technical demonstration and evaluation only. Data may be
    delayed, incomplete, unavailable, or contain errors. Nothing presented is
    investment advice, a recommendation, or an offer to buy or sell any financial
    instrument. The product must not be used for live trading or order execution.
    The API provides process health, latest stored snapshot metadata, close-only
    observations, and stored one-minute OHLC bars. The API does not determine
    market-session state, freshness, quality, or fitness. Those evaluations belong
    to the consuming governed application. Public timestamps are expected in UTC.
    Because the Worker forwards stored timestamp strings without enforcing UTC, a
    non-RFC-3339 or non-Z timestamp can satisfy this raw transport contract only as
    untrusted data and must be rejected before governed public use.
    The current Worker accepts OPTIONS on any path and returns a JSON not_found
    response for an unknown GET path; those catch-all behaviors are implementation
    details rather than additional product operations.

servers:
  - url: https://fxlive.qmvp.workers.dev
    description: Public MARKET DATA DEMO service origin

security:
  - {}

tags:
  - name: Service
    description: Service and presentation endpoints.
  - name: Market data
    description: Read-only market-data discovery and retrieval endpoints.

paths:
  /:
    get:
      operationId: getMarketBoard
      tags: [Service]
      summary: Display the FXLive market board
      description: >-
        Returns an HTML page showing bars from the latest stored snapshot. The page
        does not establish that the market is open or that values are fresh. If the
        stored snapshot cannot be loaded, the response is an HTML error page.
      responses:
        "200":
          description: Market board generated from the latest stored snapshot.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/html:
              schema:
                type: string
        "500":
          description: Required service storage binding is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/html:
              schema:
                type: string
        "503":
          description: The latest market-data snapshot is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/html:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: corsPreflightRoot
      tags: [Service]
      summary: Complete a CORS preflight request
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflightAccepted"

  /health:
    get:
      operationId: getHealth
      tags: [Service]
      summary: Report process reachability and service identity
      description: >-
        This liveness response does not inspect storage, snapshot availability,
        market-session state, freshness, data quality, or fitness.
      responses:
        "200":
          description: Worker process is reachable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                ok: true
                service: FXLive
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: corsPreflightHealth
      tags: [Service]
      summary: Complete a CORS preflight request
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflightAccepted"

  /meta:
    get:
      operationId: getSnapshotMetadata
      tags: [Market data]
      summary: Return metadata for the latest stored snapshot
      description: >-
        Returns the latest stored snapshot timing, one-minute granularity, reported
        instrument count, and the sorted identifiers currently represented in the
        snapshot. An identifier may be listed even when its completed bar is
        temporarily unavailable.
      responses:
        "200":
          description: Latest stored snapshot metadata.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"
        "500":
          $ref: "#/components/responses/StorageBindingMissing"
        "503":
          $ref: "#/components/responses/SnapshotUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: corsPreflightMeta
      tags: [Service]
      summary: Complete a CORS preflight request
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflightAccepted"

  /latest:
    get:
      operationId: getLatestObservation
      tags: [Market data]
      summary: Return a close-only observation or completed OHLC bar
      description: >-
        Supply exactly one of ticker or bar. The ticker mode returns Currency,
        Timestamp, and Close. The bar mode returns Currency, Epoch, BarStart,
        BarEnd, Granularity, Open, High, Low, and Close. Input is uppercased and
        non-letter characters are removed before validation; the normalized value
        must contain exactly six letters. Supplying both selectors is ambiguous.
      parameters:
        - name: ticker
          in: query
          required: false
          description: >-
            Select the compact close-only representation. Mutually exclusive with
            bar. The normalized value must contain exactly six letters.
          schema:
            type: string
          example: EURUSD
        - name: bar
          in: query
          required: false
          description: >-
            Select the completed one-minute OHLC representation. Mutually exclusive
            with ticker. The normalized value must contain exactly six letters.
          schema:
            type: string
          example: EURUSD
        - name: debug
          in: query
          required: false
          description: >-
            Include non-contractual request and storage timing when set to 1. Other
            values are accepted by the current implementation and ignored. Governed
            MCP tools must not request or expose this field publicly.
          schema:
            type: string
      responses:
        "200":
          description: >-
            Latest observation. The response shape is selected by the ticker or bar
            query parameter. The Worker forwards stored values; the consuming
            application must independently validate the governed OHLC rules.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LatestTickerResponse"
                  - $ref: "#/components/schemas/LatestBarResponse"
        "400":
          description: Missing, ambiguous, or invalid instrument selector.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UsageError"
                  - $ref: "#/components/schemas/InvalidTickerError"
        "404":
          description: The normalized instrument is not represented in the latest stored snapshot.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickerNotFoundError"
        "500":
          $ref: "#/components/responses/StorageBindingMissing"
        "503":
          description: The snapshot or selected completed bar is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/AnyOrigin"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SnapshotUnavailableError"
                  - $ref: "#/components/schemas/BarUnavailableError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: corsPreflightLatest
      tags: [Service]
      summary: Complete a CORS preflight request
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflightAccepted"

components:
  headers:
    NoStore:
      description: Responses must not be stored by caches.
      schema:
        type: string
        const: no-store
    AnyOrigin:
      description: Public read-only JSON endpoints permit any origin.
      schema:
        type: string
        const: "*"

  responses:
    CorsPreflightAccepted:
      description: CORS preflight accepted.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
          example: "*"
        Access-Control-Allow-Methods:
          schema:
            type: string
          example: GET, OPTIONS
        Access-Control-Allow-Headers:
          schema:
            type: string
          example: content-type
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    MethodNotAllowed:
      description: The path does not support the requested HTTP method.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/AnyOrigin"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SimpleError"
          example:
            ok: false
            error: method_not_allowed
    StorageBindingMissing:
      description: Required service storage binding is unavailable.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/AnyOrigin"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StorageBindingError"
    SnapshotUnavailable:
      description: The latest stored market-data snapshot is unavailable.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/AnyOrigin"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SnapshotUnavailableError"

  schemas:
    CurrencyIdentifier:
      type: string
      description: >-
        Expected six-letter concatenation of uppercase base- and quote-currency
        identifiers after request normalization. Stored response labels are forwarded
        by the Worker and must be validated independently by governed consumers.
      pattern: "^[A-Z]{6}$"
      examples: [EURUSD]

    UtcTimestamp:
      type: string
      format: date-time
      description: >-
        Expected RFC 3339 timestamp expressed in UTC. The Worker forwards stored
        timestamp strings and does not independently enforce this format. Governed
        consumers require a terminal Z and reject a response that does not parse as UTC.
      x-worker-enforcement: not_enforced
      x-governed-consumer-action: reject_for_governed_use_unless_RFC3339_UTC_Z
      examples: ["2026-07-20T16:54:00Z"]

    DebugTiming:
      type: object
      additionalProperties: false
      required: [Key, KVGetMs, RequestToResponseMs]
      properties:
        Key:
          type: string
        KVGetMs:
          type: number
          minimum: 0
        RequestToResponseMs:
          type: number
          minimum: 0

    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok, service]
      properties:
        ok:
          type: boolean
          const: true
        service:
          type: string
          const: FXLive

    MetadataResponse:
      type: object
      additionalProperties: false
      required: [Granularity, InstrumentCount, available]
      properties:
        Epoch:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Nanosecond-scale stored epoch value. Values may exceed the exact integer
            range of IEEE 754 binary64; clients must use BarStart and BarEnd for
            temporal correctness.
        CreatedAt:
          $ref: "#/components/schemas/UtcTimestamp"
        Granularity:
          type: string
          const: 1m
        InstrumentCount:
          type: integer
          minimum: 0
        BarStart:
          $ref: "#/components/schemas/UtcTimestamp"
        BarEnd:
          $ref: "#/components/schemas/UtcTimestamp"
        available:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyIdentifier"

    LatestTickerResponse:
      type: object
      additionalProperties: false
      required: [Currency, Timestamp, Close]
      properties:
        Currency:
          $ref: "#/components/schemas/CurrencyIdentifier"
        Timestamp:
          $ref: "#/components/schemas/UtcTimestamp"
        Close:
          type: number
        Debug:
          $ref: "#/components/schemas/DebugTiming"

    LatestBarResponse:
      type: object
      additionalProperties: false
      required:
        - Currency
        - Epoch
        - BarStart
        - BarEnd
        - Granularity
        - Open
        - High
        - Low
        - Close
      properties:
        Currency:
          $ref: "#/components/schemas/CurrencyIdentifier"
        Epoch:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Nanosecond-scale stored epoch value. Values may exceed the exact integer
            range of IEEE 754 binary64; clients must use BarStart and BarEnd for
            temporal correctness.
        BarStart:
          $ref: "#/components/schemas/UtcTimestamp"
        BarEnd:
          $ref: "#/components/schemas/UtcTimestamp"
        Granularity:
          type: string
          const: 1m
        Open:
          type: number
        High:
          type: number
        Low:
          type: number
        Close:
          type: number
        Debug:
          $ref: "#/components/schemas/DebugTiming"

    SimpleError:
      type: object
      additionalProperties: true
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string

    Usage:
      type: object
      additionalProperties: false
      required: [close, bar]
      properties:
        close:
          type: string
          const: /latest?ticker=EURUSD
        bar:
          type: string
          const: /latest?bar=EURUSD

    UsageError:
      type: object
      additionalProperties: false
      required: [ok, error, usage]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          enum: [missing_ticker, ambiguous_query]
        usage:
          $ref: "#/components/schemas/Usage"

    InvalidTickerError:
      type: object
      additionalProperties: false
      required: [ok, error, ticker, message]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          const: invalid_ticker
        ticker:
          type: string
        message:
          type: string

    TickerNotFoundError:
      type: object
      additionalProperties: false
      required: [ok, error, ticker, key, available]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          const: ticker_not_found
        ticker:
          $ref: "#/components/schemas/CurrencyIdentifier"
        key:
          type: string
        available:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyIdentifier"

    StorageBindingError:
      type: object
      additionalProperties: false
      required: [ok, error, key]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          const: kv_binding_missing
        key:
          type: string

    SnapshotUnavailableError:
      type: object
      additionalProperties: false
      required: [ok, error, key]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          const: blob_not_found
        key:
          type: string

    BarUnavailableError:
      type: object
      additionalProperties: false
      required: [ok, error, ticker, status, message]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          const: bar_not_available
        ticker:
          $ref: "#/components/schemas/CurrencyIdentifier"
        status:
          type: string
        message:
          type: string
